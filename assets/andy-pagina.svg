<g fill="#b98e98" font-family="Georgia,serif" text-anchor="middle"><text x="325" y="105" font-size="18">♡</text><text x="325" y="184" font-size="70" font-style="italic" fill="#57304f">Andy</text></g>
<path d="M175 215 Q250 235 325 215 Q400 235 475 215" fill="none" stroke="#9d6a8e" stroke-width="2"/><text x="325" y="251" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#713d68">♡</text>
<g fill="#59334f" font-family="Georgia,serif" font-style="italic" text-anchor="middle">
<text x="325" y="318" font-size="27">Eres la única</text><text x="325" y="354" font-size="27">que ha estado</text><text x="325" y="390" font-size="27">siempre ahí para mí,</text><text x="325" y="426" font-size="27">la única que realmente</text><text x="325" y="462" font-size="27">me entiende.</text>
<text x="325" y="532" font-size="27">Eres la esperanza</text><text x="325" y="568" font-size="27">que me mantiene en pie,</text><text x="325" y="604" font-size="27">mi refugio en medio del caos.</text><text x="325" y="672" font-size="27">No imagino mi vida</text><text x="325" y="708" font-size="27">sin tenerte en ella.</text></g>
